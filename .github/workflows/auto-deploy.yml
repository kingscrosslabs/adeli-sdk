name: Auto Deploy Commit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-deploy-commit:
    name: Create Auto Deploy Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Match on email only: GitHub squash merges use the profile name
      # ("Nick Reyes"), not the local git name ("Nicolas Reyes").
      - name: Get commit author email
        id: commit_author
        run: |
          EMAIL=$(git log -1 --pretty=format:'%ae')
          echo "email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Get previous commit info
        id: prev_commit
        run: |
          PREV_TITLE=$(git log -1 --pretty=format:'%s')
          PREV_HASH=$(git log -1 --pretty=format:'%H')
          echo "title=$PREV_TITLE" >> $GITHUB_OUTPUT
          echo "hash=$PREV_HASH" >> $GITHUB_OUTPUT

      - name: Create auto-deploy commit
        if: steps.commit_author.outputs.email != 'nick@kingscrosslabs.com'
        env:
          PREV_TITLE: ${{ steps.prev_commit.outputs.title }}
          PREV_HASH: ${{ steps.prev_commit.outputs.hash }}
        run: |
          git config --global user.name "Nicolas Reyes"
          git config --global user.email "nick@kingscrosslabs.com"
          git commit --allow-empty -m "auto-deploy: \"$PREV_TITLE\"" -m "previous commit hash: $PREV_HASH"
          git push

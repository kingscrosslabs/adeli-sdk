name: Release SDK

# One click: Actions → Release SDK → Run workflow (from main). Three jobs run in order:
#
# 1. prepare: turn the pending changesets into the next version and run every check.
#    Only if all of them pass, commit the bump to main and tag it vX.Y.Z (one atomic push).
# 2. build: check out the tag, prove it is exactly that version bump on top of the
#    commit this run started from, and pack the tarball.
# 3. publish: publish that tarball to npm with provenance.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump, check and tag
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Release SDK from main (got ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Require pending changesets
        run: |
          if ! ls .changeset/*.md >/dev/null 2>&1; then
            echo "::error::No changesets to release. Add one in a PR with: npx changeset"
            exit 1
          fi
      - name: Apply changesets
        id: version
        run: |
          set -euo pipefail
          npx changeset version
          npm install --package-lock-only --ignore-scripts
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists. Nothing new to release."
            exit 1
          fi
          if npm view "@adeli/sdk@${version}" version >/dev/null 2>&1; then
            echo "::error::@adeli/sdk@${version} is already on npm."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The same gate as CI and Release SDK. Nothing is pushed unless all of it passes.
      - run: npm run check:generated
      - run: npm run check:contract
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:package
      - run: npm run test:package
      - run: npm run typecheck:examples
      - run: npm run release:check
      - name: Commit the version bump to main and tag it
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$tag" -m "$tag"
          # One atomic push: main and the tag land together, or neither does (for example if main moved).
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: Build tarball from the tag
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Verify the tag is exactly the version bump
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.19.1"
          node scripts/check-release-provenance.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:package
      - run: npm run test:package
      - name: Require approved license before creating publish artifact
        run: test "$(node -p "require('./package.json').license")" != "UNLICENSED"
      - name: Pack the tarball without lifecycle scripts
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/sdk-release"
          artifact="$(find "$RUNNER_TEMP/sdk-release" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$artifact"
          node scripts/check-release-provenance.mjs --artifact "$artifact" --write-identity "$RUNNER_TEMP/sdk-release/identity.json"
          sha256sum "$artifact" > "$RUNNER_TEMP/sdk-release/artifact.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: sdk-release-tarball
          path: |
            ${{ runner.temp }}/sdk-release/*.tgz
            ${{ runner.temp }}/sdk-release/identity.json
            ${{ runner.temp }}/sdk-release/artifact.sha256
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [prepare, build]
    # npm's trusted publisher is bound to this workflow file and environment name.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: sdk-release-tarball
          path: release
      - name: Recheck the release identity and tarball
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(npm --version)" = "11.19.1"
          artifact="$(find release -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$artifact"
          node scripts/check-release-provenance.mjs --artifact "$artifact" --identity-file release/identity.json
      - name: Publish the tarball with OIDC provenance
        run: |
          set -euo pipefail
          set -- ./release/*.tgz
          test "$#" -eq 1
          # The ./ matters: without it npm reads release/x.tgz as a GitHub user/repo.
          npm publish "$1" --ignore-scripts --provenance --access public

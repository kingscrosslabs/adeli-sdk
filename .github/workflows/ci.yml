name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Prepare release starts CI on release/* branches, because PRs opened by the workflow token don't trigger pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # check:generated writes only to a temporary directory and detects committed drift.
      - run: npm run check:generated
      - run: npm run check:contract
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:package
      - run: npm run test:package
      - run: npm run typecheck:examples

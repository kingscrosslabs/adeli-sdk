name: Prepare release

# Click Run workflow (from main). It turns the pending changesets into the next
# version and opens a release/X.Y.Z PR. Merging that PR tags the release and
# starts the Release SDK workflow (see tag-release.yml).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open the release PR
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Prepare release from main (got ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Require pending changesets
        run: |
          if ! ls .changeset/*.md >/dev/null 2>&1; then
            echo "::error::No changesets to release. Add one in a PR with: npx changeset"
            exit 1
          fi
      - name: Apply changesets
        id: version
        run: |
          set -euo pipefail
          npx changeset version
          npm install --package-lock-only --ignore-scripts
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists. Nothing new to release."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - run: npm run release:check
      - name: Push release branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "chore(release): ${VERSION}"
          git push --force origin "$branch"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Releases \`@adeli/sdk@${VERSION}\`. Generated by the **Prepare release** workflow from the pending changesets." \
            "Review the version bump and \`CHANGELOG.md\`. Merging this PR tags \`v${VERSION}\` and starts **Release SDK**. Then approve its \`publish\` step at \`npm-release\`." \
            "See [docs/releasing.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/releasing.md).")"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "chore(release): ${VERSION}" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "chore(release): ${VERSION}" --body "$body"
          fi
          # PRs opened with the workflow token don't trigger pull_request runs, so start CI on the branch directly.
          gh workflow run ci.yml --ref "$branch"
          echo "### Release PR for ${VERSION} is open" >> "$GITHUB_STEP_SUMMARY"
          gh pr view "$branch" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

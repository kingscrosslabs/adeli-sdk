name: Prepare release

# Click Run workflow (from main). It turns the pending changesets into the next
# version, runs every check, and only if they all pass commits the version bump
# to main and tags it vX.Y.Z in one push. Then run Release SDK on that tag.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump, check and tag
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Prepare release from main (got ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Require pending changesets
        run: |
          if ! ls .changeset/*.md >/dev/null 2>&1; then
            echo "::error::No changesets to release. Add one in a PR with: npx changeset"
            exit 1
          fi
      - name: Apply changesets
        id: version
        run: |
          set -euo pipefail
          npx changeset version
          npm install --package-lock-only --ignore-scripts
          version="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists. Nothing new to release."
            exit 1
          fi
          if npm view "@adeli/sdk@${version}" version >/dev/null 2>&1; then
            echo "::error::@adeli/sdk@${version} is already on npm."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # The same gate as CI and Release SDK. Nothing is pushed unless all of it passes.
      - run: npm run check:generated
      - run: npm run check:contract
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:package
      - run: npm run test:package
      - run: npm run typecheck:examples
      - run: npm run release:check
      - name: Commit the version bump to main and tag it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$tag" -m "$tag"
          # One atomic push: main and the tag land together, or neither does (for example if main moved).
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${tag}"
          {
            echo "### Tagged ${tag}"
            echo "Next: Actions → Release SDK → Run workflow → Use workflow from → Tags → ${tag}"
          } >> "$GITHUB_STEP_SUMMARY"

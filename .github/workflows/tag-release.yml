name: Tag release

# When a merge to main changes package.json's version, tag that commit as
# vX.Y.Z and start the Release SDK workflow on the tag. Publishing still waits
# for approval at the npm-release environment.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and start the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Tag the new version
        id: tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to tag." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if npm view "@adeli/sdk@${version}" version >/dev/null 2>&1; then
            echo "::error::@adeli/sdk@${version} is already on npm but ${tag} is missing. Bump the version instead of reusing it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$GITHUB_SHA" -m "$tag"
          git push origin "$tag"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Start Release SDK on the tag
        if: steps.tag.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          echo "### Tagged ${TAG} and started Release SDK" >> "$GITHUB_STEP_SUMMARY"
          echo "Approve the publish step at npm-release: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
